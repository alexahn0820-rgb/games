<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>게임 모음</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  main { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 8px 20px 40px; }
  h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.2; letter-spacing: -.02em; margin: 5vh 0 10px; }
  .lead { margin: 0 0 30px; color: var(--muted); line-height: 1.6; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin: 0; padding: 0; list-style: none; }
  .game { display: block; height: 100%; overflow: hidden; color: inherit; text-decoration: none; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .game:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }
  .art { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; aspect-ratio: 16 / 10; padding: 14px 44px; background: var(--tray); }
  .art i { border-radius: 3px; background: linear-gradient(145deg, #d9694b, #f7c56b); }
  .art i:nth-child(2n) { background: linear-gradient(145deg, #33294a, #8c4a54); }
  .art i:nth-child(6) { background: none; }
  .art.blend { position: relative; display: block; }
  .art.blend i { position: absolute; top: 18%; width: 34%; height: 64%; border-radius: 6px; }
  .art.blend i:first-child { left: 24%; background: linear-gradient(145deg, #d9694b, #f7c56b); }
  .art.blend i:last-child { left: 42%; background: linear-gradient(145deg, #33294a, #8c4a54); opacity: .6; }
  .art.hunt { position: relative; display: block; background: linear-gradient(160deg, #5aa7d8 0%, #f3d7a7 55%, #3a3128 56%); }
  .art.hunt i:first-child { position: absolute; left: 22%; top: 46%; width: 9%; height: 13%; border: 3px solid #4cd964; border-radius: 3px; background: none; }
  .art.hunt i:last-child { position: absolute; right: 12%; top: 14%; width: 34%; height: 54%; border: 4px solid #fffaf1; border-radius: 6px; background: repeating-linear-gradient(90deg, #c8452d 0 18%, #ffe9a8 18% 30%); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .info { display: block; padding: 16px 18px 18px; }
  .info b { display: block; margin-bottom: 4px; font-size: 19px; }
  .info span { color: var(--muted); font-size: 14px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>게임 모음
  </a>
</header>

<main>
  <h1>오늘은 뭘 해볼까요?</h1>
  <p class="lead">설치 없이 브라우저에서 바로 즐길 수 있습니다.</p>

  <!-- 새 게임을 추가할 때는 폴더를 만들고 아래 li를 하나 복사해 고칩니다. 경로는 상대 경로로 씁니다. -->
  <ul class="games">
    <li>
      <a class="game" href="sliding-puzzle/">
        <span class="art" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="info"><b>슬라이딩 퍼즐</b><span>직접 찍은 사진이나 이미지로 만드는 퍼즐</span></span>
      </a>
    </li>
    <li>
      <a class="game" href="photo-blend/">
        <span class="art blend" aria-hidden="true"><i></i><i></i></span>
        <span class="info"><b>사진 합성 맞히기</b><span>겹쳐진 두 장이 몇 번 사진인지 맞히는 게임</span></span>
      </a>
    </li>
    <li>
      <a class="game" href="zoom-hunt/">
        <span class="art hunt" aria-hidden="true"><i></i><i></i></span>
        <span class="info"><b>확대 조각 위치 찾기</b><span>크게 확대한 작은 조각이 사진 어디에 있는지 찾는 게임</span></span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
