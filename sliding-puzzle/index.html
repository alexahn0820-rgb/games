<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>슬라이딩 퍼즐</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  main { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 8px 20px 28px; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: clamp(30px, 6vw, 50px); line-height: 1.2; margin: 5vh 0 12px; text-align: center; letter-spacing: -.02em; }
  h2 { font-size: 22px; margin: 4px 0 14px; text-align: center; }
  .lead { color: var(--muted); margin: 0 0 30px; text-align: center; line-height: 1.6; }

  .sources { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 640px; }
  .source {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 24px; min-height: 170px;
    text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .source:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }
  .source svg { width: 34px; height: 34px; margin-bottom: auto; color: var(--accent); }
  .source b { font-size: 19px; }
  .source span { color: var(--muted); font-size: 14px; }
  .sample { margin-top: 20px; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 8px; }
  body.dragging main { outline: 3px dashed var(--accent); outline-offset: -8px; border-radius: 16px; }

  .btn { min-height: 44px; padding: 9px 18px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-weight: 650; }
  .btn:hover { border-color: var(--ink); }
  .btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }

  .stage { width: min(100%, 480px, calc(100dvh - 330px)); min-width: 200px; aspect-ratio: 1; position: relative; overflow: hidden; border-radius: 12px; background: var(--tray); box-shadow: var(--shadow); margin-bottom: 16px; }
  .stage video, .stage canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
  #video.mirror { transform: scaleX(-1); }
  #cropCanvas { cursor: grab; touch-action: none; }
  #cropCanvas:active { cursor: grabbing; }
  .camera-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: #f5efe4; line-height: 1.6; }
  .shutter { width: 68px; height: 68px; border-radius: 50%; padding: 0; background: var(--accent); border: 4px solid var(--card); box-shadow: 0 0 0 2px var(--accent); }
  .shutter:hover { background: var(--accent-dark); }
  .shutter:disabled { opacity: .4; cursor: not-allowed; }
  .zoom { display: flex; align-items: center; gap: 10px; width: min(100%, 480px); margin-bottom: 14px; color: var(--muted); font-size: 14px; }
  .zoom input { flex: 1; accent-color: var(--accent); }

  .sizes { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: #e9dfcf; }
  .panel .sizes { display: flex; }
  .panel .sizes label { flex: 1; }
  .sizes label { position: relative; }
  .sizes input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sizes span { display: block; min-width: 54px; padding: 9px 8px; text-align: center; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .sizes input:checked + span { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .sizes input:focus-visible + span { outline: 3px solid var(--accent); }
  #cropSizes { margin-bottom: 16px; }

  #game { flex-direction: row; justify-content: center; align-items: flex-start; gap: 32px; }
  .board-wrap { width: min(100%, calc(100dvh - 110px), 640px); flex: 0 1 auto; padding: 8px; border-radius: 14px; background: var(--tray); box-shadow: var(--shadow); }
  #board { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 6px; background: #241e18; touch-action: none; user-select: none; }
  .tile { position: absolute; left: 0; top: 0; padding: 1px; border: 0; background: none; transition: transform .14s cubic-bezier(.2,.8,.3,1); will-change: transform; }
  .tile:focus-visible { outline: 3px solid #fff; outline-offset: -3px; z-index: 2; }
  .face { position: relative; display: block; width: 100%; height: 100%; border-radius: 3px; background-repeat: no-repeat; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.2); }
  .num { position: absolute; left: 4px; top: 4px; min-width: 21px; padding: 1px 5px; border-radius: 5px; background: rgba(30,25,20,.76); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
  #board:not(.show-num) .num { display: none; }
  .tile.blank { visibility: hidden; opacity: 0; }
  #board.solved .tile { padding: 0; cursor: default; }
  #board.solved .face { border-radius: 0; box-shadow: none; }
  #board.solved .num { display: none; }
  #board.solved .tile.blank { visibility: visible; opacity: 1; transition: opacity .5s; }
  #peek { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  .panel { width: 260px; flex: none; display: flex; flex-direction: column; gap: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .stat small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .stat b { font-size: 25px; font-variant-numeric: tabular-nums; }
  .best { margin: 0; font-size: 14px; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .help { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

  dialog { border: 0; border-radius: 16px; padding: 26px; width: min(92vw, 360px); background: var(--card); color: var(--ink); text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(43,38,32,.5); }
  dialog h2 { font-size: 26px; margin: 0 0 6px; }
  dialog img { display: block; width: 150px; height: 150px; object-fit: cover; margin: 0 auto 14px; border-radius: 8px; }
  dialog p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
  #record { color: var(--accent-dark); font-weight: 700; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10; width: max-content; max-width: 90vw; padding: 12px 18px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 14px; }

  @media (max-width: 800px) {
    #game { flex-direction: column; align-items: center; gap: 14px; }
    .board-wrap { width: min(100%, calc(100dvh - 330px)); min-width: 280px; }
    .panel { width: 100%; max-width: 520px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; }
    .stat b { font-size: 20px; }
    .sizes span { min-width: 0; }
    .actions { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .actions .btn { padding: 8px 2px; font-size: 13px; }
    .help { display: none; }
  }
  @media (max-width: 480px) {
    .sources { grid-template-columns: 1fr; } .source { min-height: 124px; padding: 18px; }
    h1 { margin-top: 2vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="homeBtn" aria-label="처음 화면으로">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>슬라이딩 퍼즐
  </button>
  <a class="all-games" href="../">전체 게임</a>
</header>

<main>
  <section class="screen" id="home">
    <h1>사진 한 장이<br>퍼즐이 됩니다</h1>
    <p class="lead">지금 찍거나 가지고 있는 이미지를 골라 보세요.<br>사진은 이 기기 밖으로 전송되지 않습니다.</p>
    <div class="sources">
      <button class="source" id="openCamera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <b>카메라로 촬영</b><span>웹캠이나 휴대폰 카메라</span>
      </button>
      <button class="source" id="openFile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 18 5-5 3.5 3.5L16 13l4 4"/></svg>
        <b>이미지 불러오기</b><span>선택, 끌어다 놓기, 붙여넣기</span>
      </button>
    </div>
    <button class="sample" id="sampleBtn">예제 그림으로 해보기</button>
  </section>

  <section class="screen" id="camera" hidden>
    <h2>퍼즐로 만들 장면을 맞춰 주세요</h2>
    <div class="stage">
      <video id="video" playsinline muted autoplay></video>
      <div class="camera-msg" id="cameraMsg" role="status"></div>
    </div>
    <div class="row">
      <button class="btn" id="cameraBack">뒤로</button>
      <button class="shutter" id="shutter" aria-label="촬영" disabled></button>
      <button class="btn" id="switchCamera" hidden>카메라 전환</button>
    </div>
  </section>

  <section class="screen" id="crop" hidden>
    <h2>영역과 난이도를 정해 주세요</h2>
    <div class="stage"><canvas id="cropCanvas" width="720" height="720" aria-label="사진 자르기 영역. 끌어서 위치를 옮길 수 있습니다."></canvas></div>
    <label class="zoom">확대 <input type="range" id="zoom" min="1" max="4" step="0.01" value="1"></label>
    <div class="sizes" id="cropSizes" role="radiogroup" aria-label="난이도"></div>
    <div class="row">
      <button class="btn" id="cropBack">다른 사진</button>
      <button class="btn primary" id="startBtn">퍼즐 시작</button>
    </div>
  </section>

  <section class="screen" id="game" hidden>
    <div class="board-wrap">
      <div id="board" role="group" aria-label="퍼즐 판">
        <img id="peek" alt="완성된 원본 이미지" hidden>
      </div>
    </div>
    <aside class="panel">
      <div class="stats">
        <div class="stat"><small>이동</small><b id="moves">0</b></div>
        <div class="stat"><small>시간</small><b id="time">00:00</b></div>
      </div>
      <p class="best" id="best"></p>
      <div class="sizes" id="gameSizes" role="radiogroup" aria-label="난이도"></div>
      <div class="actions">
        <button class="btn" id="peekBtn" aria-pressed="false">원본 보기</button>
        <button class="btn" id="numBtn" aria-pressed="false">번호 표시</button>
        <button class="btn" id="shuffleBtn">다시 섞기</button>
        <button class="btn" id="newPhotoBtn">새 사진</button>
      </div>
      <p class="help">빈칸과 같은 줄의 조각을 누르면 한 번에 밀립니다. 밀어서 움직이거나 방향키를 써도 됩니다.</p>
    </aside>
  </section>
</main>

<dialog id="winDialog">
  <h2>완성!</h2>
  <img id="winImage" alt="완성한 퍼즐 이미지">
  <p><span id="winText"></span><br><span id="record"></span></p>
  <div class="row">
    <button class="btn" id="winNew">새 사진</button>
    <button class="btn primary" id="winAgain">한 판 더</button>
  </div>
</dialog>

<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="captureInput" accept="image/*" capture="environment" hidden>
<div id="toast" role="alert" hidden></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const SIZES = [3, 4, 5, 6];
  const MAX_SOURCE = 2048, PUZZLE_SIZE = 1080;
  const screens = ['home', 'camera', 'crop', 'game'];

  let current = 'home', size = 4, toastTimer;

  function show(name) {
    if (current === 'camera' && name !== 'camera') stopCamera();
    if (current === 'game' && name !== 'game') stopTimer();
    if ($('winDialog').open) $('winDialog').close();
    current = name;
    screens.forEach(s => { $(s).hidden = s !== name; });
    window.scrollTo(0, 0);
  }

  function toast(message) {
    const el = $('toast');
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 4200);
  }

  /* ---------- 난이도 선택 ---------- */
  function buildSizes(container, name) {
    container.innerHTML = SIZES.map(n =>
      `<label><input type="radio" name="${name}" value="${n}"><span>${n}×${n}</span></label>`).join('');
    container.addEventListener('change', e => {
      setSize(Number(e.target.value));
      if (name === 'gameSize') newGame();
      else drawCrop();
    });
  }
  function setSize(n) {
    size = n;
    document.querySelectorAll(`.sizes input[value="${n}"]`).forEach(i => { i.checked = true; });
  }
  buildSizes($('cropSizes'), 'cropSize');
  buildSizes($('gameSizes'), 'gameSize');
  setSize(size);

  /* ---------- 이미지 입력 ---------- */
  function toSourceCanvas(img, w, h) {
    const ratio = Math.min(1, MAX_SOURCE / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * ratio);
    c.height = Math.round(h * ratio);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c;
  }

  function loadFile(file) {
    if (!file) return;
    if (file.type && !file.type.startsWith('image/')) { toast('이미지 파일만 사용할 수 있습니다.'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      if (!img.naturalWidth) { toast('이미지 크기를 읽을 수 없습니다.'); return; }
      openCrop(toSourceCanvas(img, img.naturalWidth, img.naturalHeight));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      toast('이 브라우저에서 열 수 없는 이미지입니다. JPG나 PNG로 시도해 주세요.');
    };
    img.src = url;
  }

  function sampleImage() {
    const c = document.createElement('canvas');
    c.width = c.height = 1080;
    const x = c.getContext('2d');
    const sky = x.createLinearGradient(0, 0, 0, 760);
    sky.addColorStop(0, '#22345f'); sky.addColorStop(.55, '#d9694b'); sky.addColorStop(1, '#f7c56b');
    x.fillStyle = sky; x.fillRect(0, 0, 1080, 1080);
    x.fillStyle = '#fff1c9'; x.beginPath(); x.arc(720, 470, 118, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 46; i++) {
      const px = (i * 397) % 1080, py = (i * 149) % 330;
      x.fillRect(px, py, 2 + i % 3, 2 + i % 3);
    }
    [['#8c4a54', 610, 90], ['#5b3650', 720, 70], ['#33294a', 840, 55], ['#1b1b33', 960, 38]].forEach(([color, base, amp], l) => {
      x.fillStyle = color; x.beginPath(); x.moveTo(0, 1080);
      for (let px = 0; px <= 1080; px += 12) {
        x.lineTo(px, base + Math.sin(px / (120 + l * 35) + l * 2) * amp + Math.sin(px / 47 + l) * amp * .22);
      }
      x.lineTo(1080, 1080); x.fill();
    });
    return c;
  }

  /* ---------- 카메라 ---------- */
  const video = $('video');
  let stream = null, facing = 'environment', cameraRequest = 0;

  function stopCamera() {
    cameraRequest++;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    $('shutter').disabled = true;
  }

  function cameraMessage(text, offerNative) {
    const box = $('cameraMsg');
    box.hidden = false;
    box.textContent = '';
    const p = document.createElement('div');
    p.textContent = text;
    box.append(p);
    if (offerNative) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.style.color = 'var(--ink)';
      b.textContent = '기기 카메라 앱으로 촬영';
      b.onclick = () => $('captureInput').click();
      box.append(b);
    }
  }

  async function startCamera() {
    stopCamera();
    const request = cameraRequest;
    show('camera');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraMessage('이 주소에서는 브라우저가 카메라를 막습니다. HTTPS나 localhost로 열어 주세요.', true);
      return;
    }
    cameraMessage('카메라를 켜는 중입니다. 권한 요청이 뜨면 허용해 주세요.');
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1920 } }
      });
      if (request !== cameraRequest) { s.getTracks().forEach(t => t.stop()); return; }
      stream = s;
      video.srcObject = s;
      await video.play();
      if (request !== cameraRequest) return;
      const actual = s.getVideoTracks()[0].getSettings().facingMode;
      video.classList.toggle('mirror', actual ? actual === 'user' : facing === 'user');
      $('cameraMsg').hidden = true;
      $('shutter').disabled = false;
      const devices = await navigator.mediaDevices.enumerateDevices();
      $('switchCamera').hidden = devices.filter(d => d.kind === 'videoinput').length < 2;
    } catch (err) {
      if (request !== cameraRequest) return;
      const messages = {
        NotAllowedError: '카메라 권한이 거부되었습니다. 주소창의 사이트 설정에서 허용해 주세요.',
        NotFoundError: '사용할 수 있는 카메라를 찾지 못했습니다.',
        NotReadableError: '다른 프로그램이 카메라를 사용 중입니다. 그 프로그램을 닫고 다시 시도해 주세요.'
      };
      cameraMessage(messages[err.name] || '카메라를 시작하지 못했습니다.', true);
    }
  }

  function capture() {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (video.classList.contains('mirror')) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, w, h);
    openCrop(toSourceCanvas(c, w, h));
  }

  /* ---------- 자르기 ---------- */
  const cropCanvas = $('cropCanvas'), cropCtx = cropCanvas.getContext('2d');
  const VIEW = cropCanvas.width;
  const crop = { src: null, base: 1, zoom: 1, x: 0, y: 0 };
  const pointers = new Map();
  let pinchStart = null;

  function openCrop(src) {
    crop.src = src;
    crop.base = Math.max(VIEW / src.width, VIEW / src.height);
    crop.zoom = 1;
    $('zoom').value = 1;
    crop.x = (VIEW - src.width * crop.base) / 2;
    crop.y = (VIEW - src.height * crop.base) / 2;
    show('crop');
    drawCrop();
  }

  function clampCrop() {
    const s = crop.base * crop.zoom;
    crop.x = Math.min(0, Math.max(VIEW - crop.src.width * s, crop.x));
    crop.y = Math.min(0, Math.max(VIEW - crop.src.height * s, crop.y));
  }

  function setZoom(next, cx = VIEW / 2, cy = VIEW / 2) {
    const zoom = Math.min(4, Math.max(1, next));
    const ratio = zoom / crop.zoom;
    crop.x = cx - (cx - crop.x) * ratio;
    crop.y = cy - (cy - crop.y) * ratio;
    crop.zoom = zoom;
    $('zoom').value = zoom;
    drawCrop();
  }

  function drawCrop() {
    if (!crop.src) return;
    clampCrop();
    const s = crop.base * crop.zoom;
    cropCtx.imageSmoothingQuality = 'high';
    cropCtx.clearRect(0, 0, VIEW, VIEW);
    cropCtx.drawImage(crop.src, crop.x, crop.y, crop.src.width * s, crop.src.height * s);
    cropCtx.strokeStyle = 'rgba(255,255,255,.75)';
    cropCtx.lineWidth = 2;
    cropCtx.beginPath();
    for (let i = 1; i < size; i++) {
      const p = Math.round(VIEW * i / size) + .5;
      cropCtx.moveTo(p, 0); cropCtx.lineTo(p, VIEW);
      cropCtx.moveTo(0, p); cropCtx.lineTo(VIEW, p);
    }
    cropCtx.stroke();
  }

  const toView = e => {
    const r = cropCanvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * VIEW / r.width, y: (e.clientY - r.top) * VIEW / r.height };
  };
  const pinchInfo = () => {
    const [a, b] = [...pointers.values()];
    return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  };
  cropCanvas.addEventListener('pointerdown', e => {
    cropCanvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, toView(e));
    if (pointers.size === 2) pinchStart = { ...pinchInfo(), zoom: crop.zoom };
  });
  cropCanvas.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const now = toView(e);
    pointers.set(e.pointerId, now);
    if (pointers.size === 1) {
      crop.x += now.x - prev.x;
      crop.y += now.y - prev.y;
      drawCrop();
    } else if (pointers.size === 2 && pinchStart) {
      const p = pinchInfo();
      setZoom(pinchStart.zoom * p.dist / pinchStart.dist, p.x, p.y);
    }
  });
  const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinchStart = null; };
  cropCanvas.addEventListener('pointerup', endPointer);
  cropCanvas.addEventListener('pointercancel', endPointer);
  cropCanvas.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toView(e);
    setZoom(crop.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), p.x, p.y);
  }, { passive: false });
  $('zoom').addEventListener('input', e => setZoom(Number(e.target.value)));

  function startFromCrop() {
    const c = document.createElement('canvas');
    c.width = c.height = PUZZLE_SIZE;
    const ctx = c.getContext('2d');
    const k = PUZZLE_SIZE / VIEW, s = crop.base * crop.zoom * k;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(crop.src, crop.x * k, crop.y * k, crop.src.width * s, crop.src.height * s);
    c.toBlob(blob => {
      if (!blob) { toast('이미지를 처리하지 못했습니다.'); return; }
      if (game.url) URL.revokeObjectURL(game.url);
      game.url = URL.createObjectURL(blob);
      $('peek').src = game.url;
      $('winImage').src = game.url;
      show('game');
      newGame();
    }, 'image/jpeg', .92);
  }

  /* ---------- 게임 ---------- */
  const board = $('board');
  const game = { url: null, n: 4, cells: [], tiles: [], moves: 0, started: 0, elapsed: 0, timer: null, playing: false };

  function shuffled(n) {
    const total = n * n, blank = total - 1;
    const cells = Array.from({ length: total }, (_, i) => i);
    const random = max => {
      const limit = Math.floor(0x100000000 / max) * max;
      const buf = new Uint32Array(1);
      do crypto.getRandomValues(buf); while (buf[0] >= limit);
      return buf[0] % max;
    };
    do {
      for (let i = total - 1; i > 0; i--) {
        const j = random(i + 1);
        [cells[i], cells[j]] = [cells[j], cells[i]];
      }
      if (!isSolvable(cells, n)) {
        const [a, b] = cells.reduce((acc, v, i) => (v !== blank && acc.length < 2 ? [...acc, i] : acc), []);
        [cells[a], cells[b]] = [cells[b], cells[a]];
      }
    } while (cells.every((v, i) => v === i));
    return cells;
  }

  // 전체 순열의 홀짝과 빈칸이 목표까지 가는 거리의 홀짝이 같아야 풀 수 있다.
  function isSolvable(cells, n) {
    const seen = new Array(cells.length).fill(false);
    let swaps = 0;
    for (let i = 0; i < cells.length; i++) {
      let length = 0;
      for (let p = i; !seen[p]; p = cells[p]) { seen[p] = true; length++; }
      if (length) swaps += length - 1;
    }
    const pos = cells.indexOf(cells.length - 1);
    const distance = (n - 1 - (pos % n)) + (n - 1 - Math.floor(pos / n));
    return swaps % 2 === distance % 2;
  }

  function newGame() {
    stopTimer();
    const n = size;
    Object.assign(game, { n, moves: 0, elapsed: 0, started: 0, playing: true, cells: shuffled(n) });
    board.classList.remove('solved');
    setPeek(false);
    game.tiles.forEach(t => t.remove());
    game.tiles = Array.from({ length: n * n }, (_, id) => {
      const tile = document.createElement('button');
      tile.className = 'tile' + (id === n * n - 1 ? ' blank' : '');
      tile.dataset.id = id;
      tile.style.width = tile.style.height = `${100 / n}%`;
      const face = document.createElement('span');
      face.className = 'face';
      face.style.backgroundImage = `url("${game.url}")`;
      face.style.backgroundSize = `${n * 100}% ${n * 100}%`;
      face.style.backgroundPosition = `${(id % n) / (n - 1) * 100}% ${Math.floor(id / n) / (n - 1) * 100}%`;
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = id + 1;
      face.append(num);
      tile.append(face);
      board.append(tile);
      return tile;
    });
    renderBoard();
    updateStats();
    renderBest();
  }

  function renderBoard() {
    const n = game.n;
    game.cells.forEach((id, pos) => {
      const tile = game.tiles[id], col = pos % n, row = Math.floor(pos / n);
      tile.style.transform = `translate(${col * 100}%, ${row * 100}%)`;
      tile.dataset.pos = pos;
      const isBlank = id === n * n - 1;
      tile.tabIndex = isBlank ? -1 : 0;
      tile.setAttribute('aria-label', `조각 ${id + 1}, ${row + 1}행 ${col + 1}열`);
    });
  }

  function blankPos() { return game.cells.indexOf(game.n * game.n - 1); }

  // pos의 조각부터 빈칸 쪽 조각까지 한 번에 민다.
  function slide(pos) {
    if (!game.playing) return false;
    const n = game.n, blank = blankPos();
    if (pos === blank || pos < 0 || pos >= n * n) return false;
    const sameRow = Math.floor(pos / n) === Math.floor(blank / n);
    const sameCol = pos % n === blank % n;
    if (!sameRow && !sameCol) return false;
    const unit = sameRow ? 1 : n;
    const step = pos > blank ? unit : -unit;
    const blankId = game.cells[blank];
    for (let p = blank; p !== pos; p += step) game.cells[p] = game.cells[p + step];
    game.cells[pos] = blankId;
    game.moves += Math.abs(pos - blank) / unit;
    if (!game.timer) startTimer();
    renderBoard();
    updateStats();
    if (game.cells.every((v, i) => v === i)) win();
    return true;
  }

  function startTimer() {
    game.started = performance.now() - game.elapsed;
    game.timer = setInterval(() => {
      game.elapsed = performance.now() - game.started;
      updateStats();
    }, 250);
  }
  function stopTimer() {
    if (game.timer) {
      game.elapsed = performance.now() - game.started;
      clearInterval(game.timer);
    }
    game.timer = null;
  }
  const formatTime = ms => {
    const t = Math.floor(ms / 1000);
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  };
  function updateStats() {
    $('moves').textContent = game.moves;
    $('time').textContent = formatTime(game.elapsed);
  }

  function readBest(n) {
    try { return JSON.parse(localStorage.getItem(`sliding-best-${n}`)) || null; }
    catch { return null; }
  }
  function renderBest() {
    const b = readBest(game.n);
    $('best').textContent = b
      ? `${game.n}×${game.n} 최고 기록: ${b.moves}회, ${formatTime(b.time)}`
      : `${game.n}×${game.n} 첫 기록에 도전해 보세요`;
  }

  function win() {
    stopTimer();
    game.playing = false;
    updateStats();
    setPeek(false);
    board.classList.add('solved');
    const old = readBest(game.n);
    const best = {
      moves: old ? Math.min(old.moves, game.moves) : game.moves,
      time: old ? Math.min(old.time, game.elapsed) : game.elapsed
    };
    const isRecord = !old || best.moves < old.moves || best.time < old.time;
    try { localStorage.setItem(`sliding-best-${game.n}`, JSON.stringify(best)); } catch { /* 저장 불가 환경 */ }
    renderBest();
    $('winText').textContent = `${game.n}×${game.n}, ${game.moves}회 이동, ${formatTime(game.elapsed)}`;
    $('record').textContent = isRecord ? '새 최고 기록입니다' : '';
    setTimeout(() => { if (!game.playing && current === 'game') $('winDialog').showModal(); }, 750);
  }

  function setPeek(on) {
    $('peek').hidden = !on;
    $('peekBtn').setAttribute('aria-pressed', String(on));
  }

  /* 조각 입력: 클릭, 스와이프, 방향키 */
  let swipe = null, ignoreClick = false;
  board.addEventListener('pointerdown', e => {
    ignoreClick = false;
    const tile = e.target.closest('.tile');
    swipe = tile ? { pos: Number(tile.dataset.pos), x: e.clientX, y: e.clientY, id: e.pointerId } : null;
  });
  board.addEventListener('pointerup', e => {
    if (!swipe || swipe.id !== e.pointerId) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y, { pos } = swipe;
    swipe = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 16) return;
    ignoreClick = true;
    const n = game.n, blank = blankPos();
    const towardBlank = Math.abs(dx) > Math.abs(dy)
      ? Math.floor(pos / n) === Math.floor(blank / n) && (dx > 0) === (blank > pos)
      : pos % n === blank % n && (dy > 0) === (blank > pos);
    if (towardBlank) slide(pos);
  });
  board.addEventListener('pointercancel', () => { swipe = null; });
  board.addEventListener('click', e => {
    if (ignoreClick) { ignoreClick = false; return; }
    const tile = e.target.closest('.tile');
    if (tile) slide(Number(tile.dataset.pos));
  });

  document.addEventListener('keydown', e => {
    if (current !== 'game' || $('winDialog').open || e.target.matches('input')) return;
    const n = game.n, blank = blankPos(), col = blank % n, row = Math.floor(blank / n);
    const target = {
      ArrowLeft: col < n - 1 ? blank + 1 : -1,
      ArrowRight: col > 0 ? blank - 1 : -1,
      ArrowUp: row < n - 1 ? blank + n : -1,
      ArrowDown: row > 0 ? blank - n : -1
    }[e.key];
    if (target === undefined) return;
    e.preventDefault();
    if (target >= 0) slide(target);
  });

  /* ---------- 버튼과 파일 입력 ---------- */
  const pickFile = () => $('fileInput').click();
  const onFileInput = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('fileInput').addEventListener('change', onFileInput);
  $('captureInput').addEventListener('change', onFileInput);
  $('homeBtn').onclick = () => show('home');
  $('openCamera').onclick = startCamera;
  $('openFile').onclick = pickFile;
  $('sampleBtn').onclick = () => openCrop(sampleImage());
  $('cameraBack').onclick = () => show('home');
  $('shutter').onclick = capture;
  $('switchCamera').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); };
  $('cropBack').onclick = () => show('home');
  $('startBtn').onclick = startFromCrop;
  $('shuffleBtn').onclick = newGame;
  $('newPhotoBtn').onclick = () => show('home');
  $('peekBtn').onclick = () => setPeek($('peek').hidden);
  $('numBtn').onclick = () => {
    const on = board.classList.toggle('show-num');
    $('numBtn').setAttribute('aria-pressed', String(on));
  };
  $('winAgain').onclick = () => { $('winDialog').close(); newGame(); };
  $('winNew').onclick = () => show('home');

  /* 끌어다 놓기, 붙여넣기 */
  let dragDepth = 0;
  addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dragging');
    loadFile(e.dataTransfer.files[0]);
  });
  addEventListener('paste', e => {
    const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
    if (item) loadFile(item.getAsFile());
  });
})();
</script>
</body>
</html>
